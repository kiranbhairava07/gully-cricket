<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gully Cricket Scoreboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 10px;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      background: white;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      overflow: hidden;
    }
    .header {
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
      color: white;
      padding: 20px;
      text-align: center;
    }
    .header h1 { font-size: 24px; margin-bottom: 5px; }
    .header p { font-size: 14px; opacity: 0.9; }
    .screen { display: none; padding: 20px; }
    .screen.active { display: block; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; margin-bottom: 8px; font-weight: 600; color: #333; }
    .form-group input, .form-group select {
      width: 100%;
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 16px;
      transition: border-color 0.3s;
    }
    .form-group input:focus, .form-group select:focus { outline: none; border-color: #667eea; }
    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      margin-top: 10px;
    }
    .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4); }
    .btn-secondary { background: #f0f0f0; color: #333; }
    .btn-danger { background: #ef4444; color: white; }
    .btn-warning { background: #f59e0b; color: white; }
    .scoreboard { background: #f8f9fa; padding: 15px; border-radius: 10px; margin-bottom: 20px; }
    .score-display { text-align: center; padding: 20px; background: white; border-radius: 10px; margin-bottom: 15px; }
    .score-display h2 { font-size: 48px; color: #667eea; margin-bottom: 5px; }
    .score-display p { font-size: 18px; color: #666; }
    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
    .stat-card { background: white; padding: 12px; border-radius: 8px; text-align: center; }
    .stat-card .label { font-size: 12px; color: #666; margin-bottom: 5px; }
    .stat-card .value { font-size: 20px; font-weight: bold; color: #333; }
    .player-list { background: white; padding: 15px; border-radius: 10px; margin-bottom: 15px; }
    .player-list h3 { font-size: 16px; margin-bottom: 10px; color: #333; }
    .player-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #e0e0e0; }
    .player-item:last-child { border-bottom: none; }
    .player-name { font-weight: 600; color: #333; }
    .player-name.striker { color: #10b981; }
    .player-name.striker::after { content: " *"; color: #10b981; }
    .player-stats { font-size: 14px; color: #666; }
    .run-buttons { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 15px; }
    .run-btn {
      padding: 15px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s;
      background: white;
      color: #333;
    }
    .run-btn:hover { transform: scale(1.05); border-color: #667eea; }
    .run-btn:active { transform: scale(0.95); }
    .over-display { background: white; padding: 15px; border-radius: 10px; margin-bottom: 15px; }
    .over-display h4 { margin-bottom: 10px; color: #333; }
    .balls-container { display: flex; gap: 5px; flex-wrap: wrap; }
    .ball { width: 35px; height: 35px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 14px; }
    .ball.dot { background: #e0e0e0; color: #666; }
    .ball.runs { background: #667eea; color: white; }
    .ball.four { background: #10b981; color: white; }
    .ball.six { background: #ef4444; color: white; }
    .ball.wicket { background: #dc2626; color: white; }
    .ball.wide, .ball.noball { background: #f59e0b; color: white; }
    .target-info {
      background: #fef3c7;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 15px;
      text-align: center;
      border-left: 4px solid #f59e0b;
    }
    .target-info h3 { color: #92400e; margin-bottom: 5px; }
    .target-info p { color: #78350f; font-size: 14px; }
    .result-banner {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: white;
      padding: 30px;
      border-radius: 15px;
      text-align: center;
      margin-bottom: 20px;
    }
    .result-banner h2 { font-size: 32px; margin-bottom: 10px; }
    .result-banner p { font-size: 18px; }
    .match-summary { background: white; padding: 20px; border-radius: 10px; }
    .match-summary h3 { margin-bottom: 15px; color: #333; }
    .inning-summary { margin-bottom: 20px; padding-bottom: 20px; border-bottom: 2px solid #e0e0e0; }
    .inning-summary:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
    .modal-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal-backdrop.active { display: flex; }
    .modal { background: white; padding: 25px; border-radius: 15px; max-width: 400px; width: 90%; }
    @media (max-width: 480px) {
      .header h1 { font-size: 20px; }
      .score-display h2 { font-size: 36px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🏏 Gully Cricket Scoreboard</h1>
      <p>Track your match like a pro!</p>
    </div>

    <div id="setupScreen" class="screen active">
      <div class="form-group"><label>Team 1 Name</label><input type="text" id="team1Input" placeholder="Enter team 1 name" /></div>
      <div class="form-group"><label>Team 2 Name</label><input type="text" id="team2Input" placeholder="Enter team 2 name" /></div>
      <div class="form-group"><label>Number of Overs</label><input type="number" id="oversInput" min="1" max="50" value="5" placeholder="Enter overs" /></div>
      <button class="btn btn-primary" onclick="setupMatch()">Start Match</button>
    </div>

    <div id="batsmenScreen" class="screen">
      <h2 style="margin-bottom: 20px; color: #333">Select Opening Batsmen</h2>
      <div class="form-group"><label>Striker (Batsman 1)</label><input type="text" id="striker1Input" placeholder="Enter striker name" /></div>
      <div class="form-group"><label>Non-Striker (Batsman 2)</label><input type="text" id="nonStriker1Input" placeholder="Enter non-striker name" /></div>
      <div class="form-group"><label>Opening Bowler</label><input type="text" id="bowler1Input" placeholder="Enter bowler name" /></div>
      <button class="btn btn-primary" onclick="startInning()">Start Innings</button>
    </div>

    <div id="scoreboardScreen" class="screen">
      <div class="scoreboard">
        <div class="score-display">
          <h2 id="totalScore">0/0</h2>
          <p id="currentTeam">Team 1</p>
          <p style="font-size: 14px; margin-top: 5px" id="oversDisplay">0.0 overs</p>
        </div>
        <div id="targetInfo" class="target-info" style="display: none"><h3>Target</h3><p id="targetText">Need 0 runs in 0 balls</p></div>
        <div class="stats-grid">
          <div class="stat-card"><div class="label">Run Rate</div><div class="value" id="runRate">0.00</div></div>
          <div class="stat-card"><div class="label">Req. Rate</div><div class="value" id="reqRate">-</div></div>
        </div>
        <div class="player-list"><h3>Batsmen</h3><div id="batsmenList"></div></div>
        <div class="player-list"><h3>Current Bowler</h3><div id="bowlerInfo"></div></div>
        <div class="over-display"><h4>This Over</h4><div class="balls-container" id="currentOverBalls"></div></div>
      </div>
      <div class="run-buttons">
        <button class="run-btn" onclick="addRuns(0)">0</button>
        <button class="run-btn" onclick="addRuns(1)">1</button>
        <button class="run-btn" onclick="addRuns(2)">2</button>
        <button class="run-btn" onclick="addRuns(3)">3</button>
        <button class="run-btn" onclick="addRuns(4)">4</button>
        <button class="run-btn" onclick="addRuns(6)">6</button>
      </div>
      <button class="btn btn-danger" style="margin-bottom: 10px" onclick="showWicketDialog()">Wicket</button>
      <button class="btn btn-warning" style="margin-bottom: 10px" onclick="showExtraDialog()">Wide / No Ball / Bye</button>
      <button class="btn btn-secondary" onclick="changeStriker()">Change Striker</button>
    </div>

    <div id="resultScreen" class="screen">
      <div class="result-banner"><h2 id="winnerText">Match Result</h2><p id="winMarginText"></p></div>
      <div class="match-summary" id="matchSummary"></div>
      <button class="btn btn-primary" onclick="newMatch()">New Match</button>
    </div>
  </div>

  <div id="wicketDialog" class="modal-backdrop">
    <div class="modal">
      <h3>Wicket!</h3>
      <div class="form-group">
        <label>Wicket Type</label>
        <select id="wicketType">
          <option value="bowled">Bowled</option>
          <option value="caught">Caught</option>
          <option value="lbw">LBW</option>
          <option value="run_out">Run Out</option>
          <option value="stumped">Stumped</option>
          <option value="hit_wicket">Hit Wicket</option>
        </select>
      </div>
      <div class="form-group"><label>New Batsman</label><input type="text" id="newBatsmanInput" placeholder="Enter batsman name" /></div>
      <button class="btn btn-primary" onclick="recordWicket()">Confirm</button>
      <button class="btn btn-secondary" onclick="closeWicketDialog()">Cancel</button>
    </div>
  </div>

  <div id="extraDialog" class="modal-backdrop">
    <div class="modal">
      <h3>Extra</h3>
      <div class="form-group">
        <label>Extra Type</label>
        <select id="extraType">
          <option value="wd">Wide</option>
          <option value="nb">No Ball</option>
          <option value="b">Bye</option>
          <option value="lb">Leg Bye</option>
        </select>
      </div>
      <div class="form-group"><label>Runs (if any)</label><input type="number" id="extraRuns" min="0" value="1" /></div>
      <button class="btn btn-primary" onclick="recordExtra()">Confirm</button>
      <button class="btn btn-secondary" onclick="closeExtraDialog()">Cancel</button>
    </div>
  </div>

  <script>
    let matchData = createMatchData();

    function createMatchData() {
      return {
        team1: '',
        team2: '',
        overs: 5,
        currentInning: 1,
        inning1: createInning(''),
        inning2: createInning('')
      };
    }

    function createInning(teamName) {
      return {
        battingTeam: teamName,
        runs: 0,
        wickets: 0,
        balls: 0,
        extras: 0,
        batsmen: [],
        bowlers: [],
        ballByBall: []
      };
    }

    function showScreen(id) {
      document.querySelectorAll('.screen').forEach((el) => el.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    function setupMatch() {
      const team1 = document.getElementById('team1Input').value.trim();
      const team2 = document.getElementById('team2Input').value.trim();
      const overs = parseInt(document.getElementById('oversInput').value, 10);

      if (!team1 || !team2) return alert('Please enter both team names.');
      if (team1.toLowerCase() === team2.toLowerCase()) return alert('Team names must be different.');
      if (!Number.isInteger(overs) || overs < 1 || overs > 50) return alert('Overs must be between 1 and 50.');

      matchData = createMatchData();
      matchData.team1 = team1;
      matchData.team2 = team2;
      matchData.overs = overs;
      matchData.inning1.battingTeam = team1;
      matchData.inning2.battingTeam = team2;

      showScreen('batsmenScreen');
    }

    function startInning() {
      const striker = document.getElementById('striker1Input').value.trim();
      const nonStriker = document.getElementById('nonStriker1Input').value.trim();
      const bowler = document.getElementById('bowler1Input').value.trim();

      if (!striker || !nonStriker || !bowler) return alert('Please enter striker, non-striker, and bowler.');
      if (striker.toLowerCase() === nonStriker.toLowerCase()) return alert('Striker and non-striker must be different.');

      const inning = getCurrentInning();
      inning.batsmen.push({ name: striker, runs: 0, balls: 0, fours: 0, sixes: 0, isOut: false, isStriker: true });
      inning.batsmen.push({ name: nonStriker, runs: 0, balls: 0, fours: 0, sixes: 0, isOut: false, isStriker: false });
      inning.bowlers.push({ name: bowler, balls: 0, runs: 0, wickets: 0, maidens: 0 });

      updateScoreboard();
      showScreen('scoreboardScreen');
    }

    function getCurrentInning() {
      return matchData.currentInning === 1 ? matchData.inning1 : matchData.inning2;
    }

    function getStriker() {
      return getCurrentInning().batsmen.find((b) => b.isStriker && !b.isOut);
    }

    function getCurrentBowler() {
      const bowlers = getCurrentInning().bowlers;
      return bowlers[bowlers.length - 1];
    }

    function addRuns(runs) {
      const inning = getCurrentInning();
      const striker = getStriker();
      const bowler = getCurrentBowler();
      if (!striker || !bowler) return;

      striker.runs += runs;
      striker.balls += 1;
      if (runs === 4) striker.fours += 1;
      if (runs === 6) striker.sixes += 1;

      inning.runs += runs;
      inning.balls += 1;
      bowler.balls += 1;
      bowler.runs += runs;

      inning.ballByBall.push({ type: 'runs', value: runs, isWicket: false });

      if (runs % 2 === 1) toggleStrike();
      if (inning.balls % 6 === 0) handleOverComplete();

      checkInningEnd();
      updateScoreboard();
    }

    function showWicketDialog() {
      const inning = getCurrentInning();
      if (inning.wickets >= 9) return alert('Next wicket ends the innings (all out).');
      document.getElementById('wicketDialog').classList.add('active');
    }

    function closeWicketDialog() {
      document.getElementById('wicketDialog').classList.remove('active');
      document.getElementById('newBatsmanInput').value = '';
    }

    function recordWicket() {
      const inning = getCurrentInning();
      const striker = getStriker();
      const bowler = getCurrentBowler();
      if (!striker || !bowler) return;

      const wicketType = document.getElementById('wicketType').value;
      const newBatsmanName = document.getElementById('newBatsmanInput').value.trim();

      striker.isOut = true;
      striker.outType = wicketType;
      striker.balls += 1;

      inning.wickets += 1;
      inning.balls += 1;
      bowler.balls += 1;
      bowler.wickets += 1;

      inning.ballByBall.push({ type: 'wicket', value: 'W', isWicket: true });

      if (inning.wickets < 10) {
        if (!newBatsmanName) return alert('Please enter new batsman name.');
        inning.batsmen.forEach((b) => { if (!b.isOut) b.isStriker = false; });
        inning.batsmen.push({ name: newBatsmanName, runs: 0, balls: 0, fours: 0, sixes: 0, isOut: false, isStriker: true });
      }

      closeWicketDialog();

      if (inning.balls % 6 === 0) handleOverComplete();
      checkInningEnd();
      updateScoreboard();
    }

    function showExtraDialog() {
      document.getElementById('extraDialog').classList.add('active');
    }

    function closeExtraDialog() {
      document.getElementById('extraDialog').classList.remove('active');
    }

    function recordExtra() {
      const extraType = document.getElementById('extraType').value;
      const extraRuns = Math.max(0, parseInt(document.getElementById('extraRuns').value, 10) || 0);
      const inning = getCurrentInning();
      const bowler = getCurrentBowler();
      const striker = getStriker();
      if (!bowler) return;

      const doesCountBall = extraType === 'b' || extraType === 'lb';

      inning.runs += extraRuns;
      inning.extras += extraRuns;
      bowler.runs += extraRuns;

      if (doesCountBall) {
        inning.balls += 1;
        bowler.balls += 1;
        if (striker) striker.balls += 1;
        if (extraRuns % 2 === 1) toggleStrike();
        if (inning.balls % 6 === 0) handleOverComplete();
      }

      inning.ballByBall.push({ type: 'extra', value: `${extraType.toUpperCase()}${extraRuns}`, isWicket: false });
      closeExtraDialog();

      checkInningEnd();
      updateScoreboard();
    }

    function toggleStrike() {
      const activeBatsmen = getCurrentInning().batsmen.filter((b) => !b.isOut);
      if (activeBatsmen.length !== 2) return;
      activeBatsmen[0].isStriker = !activeBatsmen[0].isStriker;
      activeBatsmen[1].isStriker = !activeBatsmen[1].isStriker;
    }

    function changeStriker() {
      toggleStrike();
      updateScoreboard();
    }

    function handleOverComplete() {
      toggleStrike();
      const newBowler = prompt('Over complete! Enter new bowler name:');
      if (!newBowler || !newBowler.trim()) {
        alert('Bowler name not provided. Continuing with the same bowler.');
        return;
      }
      getCurrentInning().bowlers.push({ name: newBowler.trim(), balls: 0, runs: 0, wickets: 0, maidens: 0 });
    }

    function checkInningEnd() {
      const inning = getCurrentInning();
      const maxBalls = matchData.overs * 6;

      if (matchData.currentInning === 2 && inning.runs > matchData.inning1.runs) {
        endMatch();
        return;
      }

      if (inning.wickets >= 10 || inning.balls >= maxBalls) {
        endInning();
      }
    }

    function endInning() {
      if (matchData.currentInning === 1) {
        const confirmStartSecond = window.confirm(
          `First innings complete! ${matchData.team1}: ${matchData.inning1.runs}/${matchData.inning1.wickets}. Start second innings?`
        );

        if (confirmStartSecond) {
          matchData.currentInning = 2;
          document.getElementById('striker1Input').value = '';
          document.getElementById('nonStriker1Input').value = '';
          document.getElementById('bowler1Input').value = '';
          showScreen('batsmenScreen');
        }
      } else {
        endMatch();
      }
    }

    function endMatch() {
      const i1 = matchData.inning1;
      const i2 = matchData.inning2;
      let winner;
      let margin;

      if (i1.runs > i2.runs) {
        winner = matchData.team1;
        margin = `by ${i1.runs - i2.runs} runs`;
      } else if (i2.runs > i1.runs) {
        winner = matchData.team2;
        margin = `by ${10 - i2.wickets} wickets`;
      } else {
        winner = 'Match Tied';
        margin = '';
      }

      document.getElementById('winnerText').textContent = winner === 'Match Tied' ? 'Match Tied!' : `${winner} wins!`;
      document.getElementById('winMarginText').textContent = margin;

      document.getElementById('matchSummary').innerHTML = renderInningSummary(matchData.team1, i1, i2.bowlers) + renderInningSummary(matchData.team2, i2, i1.bowlers);
      showScreen('resultScreen');
    }

    function renderInningSummary(teamName, inning, oppositionBowlers) {
      const batsmenRows = inning.batsmen
        .map((b) => {
          const sr = b.balls > 0 ? ((b.runs / b.balls) * 100).toFixed(2) : '0.00';
          return `<p>${b.name}: ${b.runs}(${b.balls}) - ${b.isOut ? b.outType : 'Not Out'}, SR: ${sr}</p>`;
        })
        .join('');

      const bowlersRows = oppositionBowlers
        .map((b) => {
          const economy = b.balls > 0 ? ((b.runs / b.balls) * 6).toFixed(2) : '0.00';
          return `<p>${b.name}: ${Math.floor(b.balls / 6)}.${b.balls % 6}-${b.maidens}-${b.runs}-${b.wickets}, Econ: ${economy}</p>`;
        })
        .join('');

      return `
        <div class="inning-summary">
          <h3>${teamName} - ${inning.runs}/${inning.wickets}</h3>
          <p>Overs: ${Math.floor(inning.balls / 6)}.${inning.balls % 6}</p>
          <p>Extras: ${inning.extras}</p>
          <h4 style="margin-top:15px;">Batsmen</h4>
          ${batsmenRows}
          <h4 style="margin-top:15px;">Bowlers</h4>
          ${bowlersRows}
        </div>
      `;
    }

    function updateScoreboard() {
      const inning = getCurrentInning();
      document.getElementById('totalScore').textContent = `${inning.runs}/${inning.wickets}`;
      document.getElementById('currentTeam').textContent = inning.battingTeam;
      document.getElementById('oversDisplay').textContent = `${Math.floor(inning.balls / 6)}.${inning.balls % 6} overs`;

      const runRate = inning.balls > 0 ? ((inning.runs / inning.balls) * 6).toFixed(2) : '0.00';
      document.getElementById('runRate').textContent = runRate;

      if (matchData.currentInning === 2) {
        const target = matchData.inning1.runs + 1;
        const needed = Math.max(0, target - inning.runs);
        const remainingBalls = Math.max(0, matchData.overs * 6 - inning.balls);
        const requiredRate = remainingBalls > 0 ? ((needed / remainingBalls) * 6).toFixed(2) : '0.00';

        document.getElementById('targetInfo').style.display = 'block';
        document.getElementById('targetText').textContent = `Need ${needed} runs in ${remainingBalls} balls`;
        document.getElementById('reqRate').textContent = requiredRate;
      } else {
        document.getElementById('targetInfo').style.display = 'none';
        document.getElementById('reqRate').textContent = '-';
      }

      document.getElementById('batsmenList').innerHTML = inning.batsmen
        .filter((b) => !b.isOut)
        .map((b) => {
          const strikeRate = b.balls > 0 ? ((b.runs / b.balls) * 100).toFixed(2) : '0.00';
          return `<div class="player-item"><div class="player-name${b.isStriker ? ' striker' : ''}">${b.name}</div><div class="player-stats">${b.runs}(${b.balls}) SR:${strikeRate}</div></div>`;
        })
        .join('');

      const bowler = getCurrentBowler();
      if (bowler) {
        const economy = bowler.balls > 0 ? ((bowler.runs / bowler.balls) * 6).toFixed(2) : '0.00';
        document.getElementById('bowlerInfo').innerHTML = `<div class="player-item"><div class="player-name">${bowler.name}</div><div class="player-stats">${Math.floor(bowler.balls / 6)}.${bowler.balls % 6}-${bowler.maidens}-${bowler.runs}-${bowler.wickets} Econ:${economy}</div></div>`;
      }

      const currentOverBalls = inning.balls % 6;
      const thisOver = inning.ballByBall.slice(-currentOverBalls);
      const overHtml = thisOver
        .map((b) => {
          let cls = 'ball ';
          if (b.isWicket) cls += 'wicket';
          else if (b.value === 0) cls += 'dot';
          else if (b.value === 4) cls += 'four';
          else if (b.value === 6) cls += 'six';
          else if (b.type === 'extra' && (String(b.value).includes('WD') || String(b.value).includes('NB'))) cls += 'wide';
          else cls += 'runs';

          return `<div class="${cls}">${b.value}</div>`;
        })
        .join('');

      document.getElementById('currentOverBalls').innerHTML = overHtml || '<p style="color:#999;">No balls yet</p>';
    }

    function newMatch() {
      location.reload();
    }
  </script>
</body>
</html>
